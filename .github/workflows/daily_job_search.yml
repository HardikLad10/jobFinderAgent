# Daily unattended job search: ingest → filter → match → email.
#
# Single UTC cron (no season guard): 0 11 * * * =
#   6:00 AM CDT (summer) / 5:00 AM CST (winter).
# Early delivery is acceptable; late (~10am) is worse. GitHub may still lag.
# Avoid dual CDT/CST crons + allowlists — stale schedule expressions from
# prior workflow versions can keep firing and get incorrectly skipped.
name: Daily job search

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Log schedule vs America/Chicago
        run: |
          echo "event=${{ github.event_name }} schedule=${{ github.event.schedule }}"
          echo "UTC=$(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Chicago=$(TZ=America/Chicago date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pipeline and email matches
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL || 'hardik.lad773@gmail.com' }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL || 'Job Finder Agent <onboarding@resend.dev>' }}
        run: python run_pipeline.py --send-email --mark-seen

      - name: Persist seen jobs store
        run: |
          if git diff --quiet -- data/seen_jobs.json; then
            echo "seen_jobs.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          git commit -m "chore: update seen jobs after daily run"
          git push
