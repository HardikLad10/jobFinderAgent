# Daily unattended job search: ingest → filter → match → email.
#
# Target: email in the early morning America/Chicago window.
# Cron is set for 6:00 AM Central so GitHub schedule lag (often 1–2h) still
# tends to deliver near 8:00 AM; on-time runs at ~6:00 AM are acceptable.
# Dual UTC crons cover CDT vs CST; season-guard keeps only the in-season one.
name: Daily job search

on:
  schedule:
    - cron: "0 11 * * *" # 6:00 AM CDT (UTC-5)
    - cron: "0 12 * * *" # 6:00 AM CST (UTC-6)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  season_guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - id: guard
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual/workflow_dispatch — run."
            exit 0
          fi
          SCHEDULE="${{ github.event.schedule }}"
          OFFSET="$(TZ=America/Chicago date +%z)"
          echo "schedule=$SCHEDULE america/chicago_offset=$OFFSET"
          echo "UTC=$(date -u '+%Y-%m-%d %H:%M:%S') Chicago=$(TZ=America/Chicago date '+%Y-%m-%d %H:%M:%S %Z')"
          SHOULD=true
          if [ "$OFFSET" = "-0500" ] && [ "$SCHEDULE" != "0 11 * * *" ]; then
            echo "Skipping CST cron while America/Chicago is on CDT."
            SHOULD=false
          fi
          if [ "$OFFSET" = "-0600" ] && [ "$SCHEDULE" != "0 12 * * *" ]; then
            echo "Skipping CDT cron while America/Chicago is on CST."
            SHOULD=false
          fi
          echo "should_run=$SHOULD" >> "$GITHUB_OUTPUT"

  run:
    needs: season_guard
    if: needs.season_guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pipeline and email matches
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL || 'hardik.lad773@gmail.com' }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL || 'Job Finder Agent <onboarding@resend.dev>' }}
        run: python run_pipeline.py --send-email --mark-seen

      - name: Persist seen jobs store
        run: |
          if git diff --quiet -- data/seen_jobs.json; then
            echo "seen_jobs.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          git commit -m "chore: update seen jobs after daily run"
          git push
